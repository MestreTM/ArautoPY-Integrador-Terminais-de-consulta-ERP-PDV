<style>
.midia-grid{display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:900px){.midia-grid{grid-template-columns:1fr 1fr}}
.midia-lista{
  max-height:300px;overflow:auto;border:1px solid var(--borda);border-radius:12px;
  background:var(--superficie-2);
}
.midia-item{
  display:flex;justify-content:space-between;align-items:center;gap:.5rem;
  padding:.55rem .75rem;border-bottom:1px solid var(--borda);
  font-family:var(--mono,ui-monospace,monospace);font-size:.84rem;color:var(--texto);
}
.midia-item:last-child{border-bottom:none}
.midia-item:hover{background:color-mix(in srgb,var(--texto) 7%,transparent)}
.seq-item{display:grid;grid-template-columns:1fr 70px 60px 40px;gap:.4rem;align-items:center;padding:.4rem 0}
.midia-select,.seq-item select,.seq-item input[type="number"],#peer{
  width:100%;height:2.35rem;padding:0 .8rem;border-radius:var(--r,8px);
  border:1px solid var(--borda);background:var(--superficie-2);
  color:var(--texto);font:inherit;font-size:.92rem;outline:none;
  transition:border-color .15s,box-shadow .15s;
  color-scheme:dark;
}
html[data-tema="claro"] .midia-select,
html[data-tema="claro"] .seq-item select,
html[data-tema="claro"] .seq-item input[type="number"],
html[data-tema="claro"] #peer{color-scheme:light}
.midia-select option,.seq-item select option,#peer option{
  background:var(--superficie);color:var(--texto);
}
.seq-item select,#peer{
  appearance:none;-webkit-appearance:none;padding-right:2rem;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--texto-2) 50%),linear-gradient(135deg,var(--texto-2) 50%,transparent 50%);
  background-position:calc(100% - 16px) calc(50% - 3px),calc(100% - 10px) calc(50% - 3px);
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;
}
.midia-select:focus,.seq-item select:focus,.seq-item input:focus,#peer:focus{
  border-color:var(--acento);box-shadow:0 0 0 3px var(--acento-tenue);
}
.midia-acoes-item{display:flex;gap:.3rem;flex-shrink:0}
.midia-modal-fundo{
  position:fixed;inset:0;z-index:70;background:rgb(0 0 0 / .55);
  display:flex;align-items:center;justify-content:center;padding:1rem;
}
.midia-modal-caixa{
  width:min(520px,100%);max-height:90vh;overflow:auto;
  background:var(--superficie);color:var(--texto);
  border:1px solid var(--borda);border-radius:14px;
  padding:1.2rem 1.35rem;box-shadow:var(--sombra-alta);
}
.midia-modal-caixa h3{margin:0 0 .75rem;font-size:1.12rem}
.midia-modal-acoes{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}
.midia-preview-box{text-align:center;min-height:120px}
.midia-preview-box img,.midia-preview-box video{
  max-width:100%;max-height:55vh;border-radius:10px;border:1px solid var(--borda);
}
.midia-upload-zone{
  border:2px dashed var(--borda-forte);border-radius:12px;padding:1.4rem 1rem;
  text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
  background:var(--superficie-2);color:var(--texto);
}
.midia-upload-zone:hover,.midia-upload-zone.is-over{
  border-color:var(--acento);background:var(--acento-tenue);
}
.midia-upload-zone strong{display:block;margin-bottom:.35rem}
</style>

<section class="cartao">
  <header class="config-secao-cab">
    <h2>Terminal</h2>
    <p class="dica">Escolha um TC-506 conectado na porta SC504.</p>
  </header>
  <div class="campo-com-acao">
    <select id="peer" class="midia-select" style="flex:1"></select>
    <button type="button" class="botao" id="btn-peers">Atualizar</button>
  </div>
  <p class="meta-img" id="status">—</p>
</section>

<div class="midia-grid">
  <section class="cartao">
    <header class="config-secao-cab"><h2>Arquivos INT_MEM</h2></header>
    <div class="midia-lista" id="lista-arquivos"></div>
    <div style="margin-top:.8rem">
      <button type="button" class="botao botao--claro" id="btn-abrir-upload">Enviar mídia…</button>
    </div>
  </section>
  <section class="cartao">
    <header class="config-secao-cab">
      <h2>Sequência (propaganda)</h2>
      <p class="dica">medias.conf — |caminho|tempo_s|loops|</p>
    </header>
    <div id="lista-seq"></div>
    <div style="margin-top:.6rem;display:flex;gap:.4rem;flex-wrap:wrap">
      <button type="button" class="botao" id="btn-add-seq">+ item</button>
      <button type="button" class="botao botao--claro" id="btn-salvar-seq">Salvar sequência</button>
    </div>
  </section>
</div>
